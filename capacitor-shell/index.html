<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>STRVend</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0d9488;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      .wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; text-align: center;
      }
      .logo { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      .logo span { color: #99f6e4; }
      .msg { font-size: 14px; opacity: 0.85; max-width: 260px; line-height: 1.5; }
      .spinner {
        width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><span>STR</span>Vend</div>
      <div class="spinner"></div>
      <div class="msg">Loading your dashboard… check your connection if this doesn't clear.</div>
    </div>
  </body>
</html>
